map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=blacksoil_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.flexibility607.cn demo.flexibility607.cn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.flexibility607.cn;

    ssl_certificate /etc/letsencrypt/live/api.flexibility607.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.flexibility607.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 12m;
    limit_req zone=blacksoil_api burst=40 nodelay;

    location = /api/v1/mobile/ws {
        proxy_pass http://127.0.0.1:8102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    location ^~ /api/v1/mobile/ {
        proxy_pass http://127.0.0.1:8102;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/device/ {
        proxy_pass http://127.0.0.1:8102;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health/b02 {
        proxy_pass http://127.0.0.1:8102;
        include proxy_params;
    }

    location = /api/v1/dashboard/events {
        proxy_pass http://127.0.0.1:8101;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:8101;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.flexibility607.cn;

    ssl_certificate /etc/letsencrypt/live/demo.flexibility607.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.flexibility607.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    root /srv/black-soil-loop-web/current;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
